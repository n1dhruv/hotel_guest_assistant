<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Dark Luxury Background -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Subtle Amber Radial Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)" />
  
  <!-- Heritage Crown Crest -->
  <path d="M 22 19 L 32 13 L 42 19 L 37 23 L 32 20 L 27 23 Z" fill="url(#goldGrad)" />
  <circle cx="32" cy="12" r="2" fill="#FEF08A" />
  <circle cx="21" cy="18" r="1.5" fill="#FEF08A" />
  <circle cx="43" cy="18" r="1.5" fill="#FEF08A" />
  
  <!-- Bold Luxury "GA" Monogram -->
  <text x="32" y="44" 
        font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" 
        font-size="21" 
        font-weight="900" 
        letter-spacing="0.5" 
        fill="url(#goldGrad)" 
        text-anchor="middle">GA</text>
        
  <!-- Bottom Heritage Bar -->
  <rect x="22" y="49" width="20" height="2" rx="1" fill="url(#goldGrad)" />
</svg>
